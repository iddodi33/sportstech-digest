name: Newsletter Source Export (28th)

# Slimmed 2026-07-24: the digest/jobs/events steps were removed — daily and
# Friday workflows already keep the hub current. This now only builds and
# emails the newsletter-source markdown ahead of the 29th newsletter build.

on:
  schedule:
    - cron: '0 6 28 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  newsletter-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build newsletter source markdown
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python newsletter_export.py

      - name: Commit newsletter source markdown
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add newsletter/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Newsletter source $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Email newsletter source
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM: monitor@sportsd3c0d3d.ie
          ALERT_TO: iddodiamant@gmail.com
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python send_newsletter_email.py
