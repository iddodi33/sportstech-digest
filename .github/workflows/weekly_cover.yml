name: Weekly LinkedIn Cover

on:
  schedule:
    # Restored 2026-09-05: the Friday post is now a carousel, so the render is
    # load-bearing, not a nice-to-have. Fires after the 08:00 Dublin draft lands
    # in Cockpit; the script is hash-idempotent and re-renders on a pick swap.
    - cron: '20 9,10,11,12 * * 5'
  workflow_dispatch:

jobs:
  cover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install supabase playwright
          playwright install --with-deps chromium

      - name: Render and attach weekly cover
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python weekly_cover.py
