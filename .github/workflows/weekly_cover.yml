name: Weekly LinkedIn Cover

on:
  workflow_dispatch:      # manual only — cron retired 2026-08-29 (Iddo cut GH Action automation load). Run manually after the Friday news brief lands in Cockpit; the script is still hash-idempotent.

jobs:
  cover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install supabase playwright
          playwright install --with-deps chromium

      - name: Render and attach weekly cover
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python weekly_cover.py
