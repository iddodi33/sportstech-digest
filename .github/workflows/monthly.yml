name: Monthly SportsTech Digest

on:
  # Cron retired 2026-07-24 (research email superseded by the newsletter + weekly
  # brief), un-retired 2026-09-04. The Google Alerts audit
  # (scripts/audit_alerts_vs_hub.py) found this is the ONLY path that reads
  # SITE_RSS_FEEDS — daily_monitor imports GOOGLE_NEWS_FEEDS alone — so while the
  # cron was off, thinkbusiness.ie / irishtechnews.ie / businessplus.ie stories
  # reached nothing, including three that scored 4-5. Weekly rather than daily so
  # this reads as a measurement of the site-RSS path, not a doubling of the
  # scoring bill. Sunday 07:00 UTC avoids the Fri 06:00 jobs/events runs and the
  # 09:00 daily monitor.
  schedule:
    - cron: '0 7 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monthly pipeline
        run: |
          python enhanced_sportstech_job_scraper_v3.py
          python news_pipeline.py
          python digest.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALERT_FROM: monitor@sportsd3c0d3d.ie
          ALERT_TO: iddodiamant@gmail.com

      - name: Commit research output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/ sportstech_jobs_ireland.csv news_raw_*.json || true
          git diff --staged --quiet || git commit -m "Monthly digest: $(date +%Y-%m)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
