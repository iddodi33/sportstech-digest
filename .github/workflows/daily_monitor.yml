name: Daily SportsTech Monitor

on:
  schedule:
    - cron: '0 9 * * *'  # 9am UTC every day
  workflow_dispatch:        # allow manual trigger

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily monitor
        run: python daily_monitor.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ALERT_FROM: monitor@sportsd3c0d3d.ie
          ALERT_TO: iddodiamant@gmail.com
          ALERT_CC: ${{ secrets.ALERT_CC }}

      # A runner's filesystem is discarded when the job ends, so the telemetry logs
      # written by run_telemetry.py have to be committed back or they produce
      # nothing from scheduled runs. This step already existed for the seen list
      # and already has contents:write — the logs just join it.
      - name: Commit seen URLs and run telemetry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add daily_monitor_seen.json || true
          git add scripts/data/daily_monitor_usage.jsonl || true
          git add scripts/data/regional_cap_drops.jsonl || true
          git add scripts/data/regional_feed_stats.jsonl || true
          git diff --staged --quiet || git commit -m "chore: seen URLs + run telemetry $(date +%Y-%m-%d)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
